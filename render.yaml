services:
  - type: web
    name: epro8-simulator
    runtime: static
    # --include=dev is deliberate: the build runs `tsc --noEmit`, and tsc is a
    # devDependency that npm would omit if NODE_ENV=production in the builder.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
